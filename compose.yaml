services:
  little-world:
    image: our-little-world:${OLW_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    # Runtime secrets only. This file must exist, stay private and remain untracked.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=256
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "scripts/container-health.cjs"]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 3
